<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#5d4b80">
<meta name="description" content="Cumpleaños y fechas importantes, con felicitación por WhatsApp. Todo se guarda solo en tu teléfono.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Mi Calendario</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Estilo de la app (⚙️ Ajustes → Colores lo cambia): todo sale de estos 5 tonos.
     --tint tiñe fondos y textos, --hdr1/--hdr2 la cabecera y --pink/--pink2 el acento (botones, hoy…) */
  --tint: #7b5fae;
  --hdr1: #5d4b80;
  --hdr2: #7c67a3;
  --pink: #f72585;
  --pink2: #b5179e;

  /* Tema claro pastel: sin blancos puros para no deslumbrar */
  --bg: color-mix(in srgb, var(--tint) 15%, #fff);
  --surface: color-mix(in srgb, var(--tint) 8%, #fff);
  --card: color-mix(in srgb, var(--tint) 7%, #fff);
  --card2: color-mix(in srgb, var(--tint) 15%, #fbfbfc);
  --border: color-mix(in srgb, var(--hdr1) 14%, transparent);
  --text: color-mix(in srgb, var(--hdr1) 35%, #16121f);
  --muted: color-mix(in srgb, var(--tint) 35%, #666472);
  --hint: color-mix(in srgb, var(--tint) 30%, #a19fa8);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px color-mix(in srgb, var(--hdr1) 8%, transparent);

  --emerald: #00d68f;
  --emerald-dim: rgba(0,214,143,.12);
  --coral: #ff3d71;
  --violet: #7b61ff;
  --amber: #ffaa00;
  --sky: #00b4d8;
  --pink-dim: color-mix(in srgb, var(--pink) 10%, transparent);

  --r: 16px;
  --r-sm: 10px;
}
[data-theme="dark"] {
  --bg: color-mix(in srgb, var(--tint) 14%, #232431);
  --surface: color-mix(in srgb, var(--tint) 14%, #2f303f);
  --card: color-mix(in srgb, var(--tint) 14%, #2f303f);
  --card2: color-mix(in srgb, var(--tint) 16%, #3d3e50);
  --border: rgba(255,255,255,.08);
  --text: #e2e8f0;
  --muted: #94a3b8;
  --hint: #64748b;
  --shadow: 0 1px 2px rgba(0,0,0,.2);
}
[data-theme="dark"] .hdr { background: linear-gradient(135deg, color-mix(in srgb, var(--hdr1) 60%, #1b1b26) 0%, color-mix(in srgb, var(--hdr2) 60%, #1b1b26) 100%); }
[data-theme="dark"] .hero { background: linear-gradient(135deg, color-mix(in srgb, var(--pink) 22%, #15131f) 0%, color-mix(in srgb, var(--hdr1) 35%, #15131f) 100%); border-color: color-mix(in srgb, var(--pink) 30%, transparent); }
[data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea { color-scheme: dark; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; font-size: 15px; line-height: 1.5;
}
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
.cell, .ev-row, .mini-g span, .metric { -webkit-tap-highlight-color: transparent; }

/* ── LAYOUT ── */
.app { display: grid; grid-template-columns: 230px 1fr; grid-template-rows: 60px 1fr; min-height: 100vh; }
.hdr {
  grid-column: 1/-1;
  background: linear-gradient(135deg, var(--hdr1) 0%, var(--hdr2) 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.hdr-logo { font-size: 16px; font-weight: 700; letter-spacing: -.3px; color: #fff; }
.hdr-logo em { color: color-mix(in srgb, var(--pink) 22%, #fff); font-style: normal; }
.hdr-actions { display: flex; align-items: center; gap: 8px; }
.hdr-btn {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.85); border-radius: 8px; padding: 6px 12px;
  font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px;
}
.hdr-btn:hover { background: rgba(255,255,255,.18); color: #fff; }
.sync-status { font-size: 12px; font-weight: 600; color: var(--sky); margin-right: 4px; }

.side { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm);
  border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500;
  cursor: pointer; text-align: left; width: 100%; transition: all .15s;
}
.nav-item:hover { background: var(--card2); color: var(--text); }
.nav-item.active { background: linear-gradient(90deg, var(--pink-dim), transparent); color: var(--pink); border-left: 3px solid var(--pink); font-weight: 700; }
.side-add { margin: 4px 0 14px; padding: 11px; border-radius: var(--r-sm); border: none; background: linear-gradient(135deg,var(--pink),var(--pink2)); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 6px 16px color-mix(in srgb, var(--pink) 30%, transparent); }
.side-sec { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.side-lbl { font-size: 10px; color: var(--hint); text-transform: uppercase; letter-spacing: .6px; margin: 0 4px 8px; font-weight: 700; }
.filt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--text); user-select: none; }
.filt:hover { background: var(--card2); }
.filt input { accent-color: var(--pink); }
.filt .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.filt.off { color: var(--hint); }

.content { padding: 24px 28px 40px; overflow-y: auto; min-width: 0; }
.page { display: none; }
.page.active { display: block; }
.page-title { font-size: 22px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 4px; }
.page-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

/* ── HERO / RESUMEN ── */
.hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.metric { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; position: relative; overflow: hidden; cursor: pointer; }
.metric::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--c, var(--pink)); }
.metric-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
.metric-val { font-size: 17px; font-weight: 800; margin-top: 4px; line-height: 1.3; }
.metric-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.avisos { background: linear-gradient(135deg, color-mix(in srgb, var(--pink) 10%, transparent), color-mix(in srgb, var(--tint) 12%, transparent)); border: 1px solid color-mix(in srgb, var(--pink) 25%, transparent); border-radius: var(--r); padding: 12px 16px; margin-bottom: 18px; }
.avisos-t { font-size: 12px; font-weight: 800; color: var(--pink); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.aviso { font-size: 13.5px; padding: 3px 0; cursor: pointer; }
.aviso b { font-weight: 700; }

/* ── MES ── */
.cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.cal-title { font-size: 22px; font-weight: 800; letter-spacing: -.4px; text-transform: capitalize; min-width: 200px; }
.nbtn { height: 36px; min-width: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; cursor: pointer; font-size: 14px; }
@media (hover: hover) { .nbtn:hover { border-color: var(--pink); color: var(--pink); } }
.cal { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); }
.cal-head div { padding: 10px 8px; font-size: 11px; font-weight: 700; color: var(--hint); text-transform: uppercase; letter-spacing: .5px; text-align: center; border-bottom: 1px solid var(--border); }
.cell { min-height: 112px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; cursor: pointer; position: relative; transition: background .1s; min-width: 0; }
.cell:nth-child(7n) { border-right: none; }
@media (hover: hover) { .cell:hover { background: var(--card2); } }
.cell.other { background: var(--bg); opacity: .55; }
.cell.weekend .dnum { color: var(--muted); }
.dnum { font-size: 13px; font-weight: 700; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 3px; }
.cell.today .dnum { background: var(--pink); color: #fff; }
.cell.holiday .dnum { color: var(--fest); }
[data-theme="dark"] .cell.holiday .dnum { color: color-mix(in srgb, var(--fest) 50%, #fff); }
.pill { display: block; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); border-left: 3px solid var(--c); }
.pill.fest { background: transparent; border-left-style: dotted; color: var(--muted); font-weight: 500; }
.more { font-size: 10.5px; color: var(--muted); font-weight: 700; padding-left: 4px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); display: block; }

/* ── LISTAS ── */
.sc { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
.sc-hdr { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sc-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.ev-row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.ev-row:last-child { border-bottom: none; }
@media (hover: hover) { .ev-row:hover { background: var(--card2); } }
.date-badge { width: 46px; flex-shrink: 0; text-align: center; border-radius: 10px; padding: 4px 0; background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--c); }
.date-badge .d { font-size: 18px; font-weight: 800; line-height: 1.1; }
.date-badge .m { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.ev-main { flex: 1; min-width: 0; }
.ev-t { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none; background: #25d366; color: #fff; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(37,211,102,.35); }
.wa:active { transform: scale(.92); }
.wa-ico { width: 60%; height: 60%; display: block; }
.wa-btn .wa-ico { width: 20px; height: 20px; display: inline-block; vertical-align: -4px; margin-right: 6px; }
.aviso .wa { width: 28px; height: 28px; font-size: 13px; margin-left: 6px; vertical-align: middle; }
.btn.wa-btn { background: #25d366; color: #fff; border: none; }
.when { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: var(--card2); color: var(--muted); white-space: nowrap; }
.when.hoy { background: var(--pink); color: #fff; }
.when.pronto { background: rgba(255,170,0,.15); color: #d48c00; }
.empty { padding: 28px 16px; text-align: center; color: var(--hint); font-size: 13.5px; }
.empty button { margin-top: 10px; }

/* ── AÑO ── */
.year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.mini { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.mini-t { font-size: 13px; font-weight: 800; text-transform: capitalize; margin-bottom: 6px; cursor: pointer; }
.mini-t:hover { color: var(--pink); }
.mini-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mini-g span { font-size: 10.5px; text-align: center; padding: 3px 0; border-radius: 6px; cursor: pointer; position: relative; }
.mini-g span.h { color: var(--hint); font-weight: 700; font-size: 9px; cursor: default; }
.mini-g span.ev { font-weight: 800; color: #fff; background: var(--c); border-radius: 8px; box-shadow: 0 1px 3px color-mix(in srgb, var(--c) 35%, transparent); }
.mini-g span.fest { color: var(--fest); font-weight: 700; }
.mini-g span.today { outline: 2px solid var(--pink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 16px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: block; }

/* ── MODAL / HOJA ── */
.ov { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 300; display: none; align-items: center; justify-content: center; padding: 16px; }
.ov.open { display: flex; }
.sheet { background: var(--surface); border-radius: 20px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.sheet-h { padding: 18px 20px 10px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.sheet-h h3 { font-size: 18px; font-weight: 800; }
.x { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--card2); color: var(--muted); font-size: 16px; cursor: pointer; }
.sheet-b { padding: 4px 20px 20px; }
.fld { margin-bottom: 12px; }
.fld label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
.fld input, .fld select, .fld textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-family: inherit; font-size: 15px; outline: none; min-width: 0; max-width: 100%; }
.fld input[type=date], .fld input[type=time] { -webkit-appearance: none; appearance: none; min-height: 46px; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--pink); }
.fld textarea { resize: vertical; min-height: 64px; }
.row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.tipos { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.tipo { border: 2px solid var(--border); background: var(--card2); border-radius: 12px; padding: 8px 2px; text-align: center; cursor: pointer; font-size: 10.5px; font-weight: 700; color: var(--muted); }
.tipo .e { font-size: 20px; display: block; line-height: 1.3; }
.tipo.sel { border-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.chk input { width: 18px; height: 18px; accent-color: var(--pink); }
.btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.btn { flex: 1; padding: 12px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer; }
.btn.primary { background: linear-gradient(135deg,var(--pink),var(--pink2)); color: #fff; border: none; }
.btn.danger { color: var(--coral); border-color: rgba(255,61,113,.4); background: transparent; flex: 0 0 auto; padding: 12px 16px; }
.btn.small { flex: 0 0 auto; padding: 8px 14px; font-size: 13px; }
.day-ev { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--card2); margin-bottom: 8px; cursor: pointer; border-left: 4px solid var(--c); }
.day-ev .e { font-size: 22px; }
.upd-banner { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 350; background: #1e293b; color: #fff; border-radius: 14px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.upd-banner[hidden] { display: none; }
.upd-banner button { background: var(--pink); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
@media (max-width: 768px) { .upd-banner { bottom: calc(80px + env(safe-area-inset-bottom)); } }
.gsteps { font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; background: var(--card2); border-radius: 12px; padding: 12px 14px; }
.hint { font-size: 12px; color: var(--hint); margin-top: -6px; margin-bottom: 12px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .2s; z-index: 400; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── RETOQUES: profundidad, animaciones y colores ── */
.metric, .cal, .sc, .mini { box-shadow: var(--shadow); }
.ov.open { animation: fundido .18s ease-out; }
.ov.open .sheet { animation: subir .24s cubic-bezier(.2,.8,.3,1); }
@keyframes fundido { from { opacity: 0; } }
@keyframes subir { from { opacity: 0; transform: translateY(16px) scale(.98); } }
.btn:active, .nbtn:active, .side-add:active, .fab:active { transform: scale(.97); }
.ev-row:active, .cell:active { background: var(--card2); }
.temas { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.tema { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; border: 2px solid transparent; background: var(--card2); cursor: pointer; font-size: 11px; font-weight: 700; color: var(--muted); }
.tema.sel { border-color: var(--pink); color: var(--text); }
.tema .bola { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); }
.tema input[type=color] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; }
.colores { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; margin-bottom: 10px; }
.color-fila { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--card2); font-size: 13px; font-weight: 600; cursor: pointer; min-width: 0; }
.color-fila span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.color-fila input[type=color] { flex-shrink: 0; width: 28px; height: 28px; padding: 0; border: none; border-radius: 50%; background: none; cursor: pointer; }
.color-fila input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.color-fila input[type=color]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,.6); border-radius: 50%; }
.color-fila input[type=color]::-moz-color-swatch { border: 2px solid rgba(255,255,255,.6); border-radius: 50%; }
.confeti { position: fixed; top: -12px; width: 8px; height: 12px; border-radius: 2px; z-index: 500; pointer-events: none; animation: caer linear forwards; }
@keyframes caer { to { transform: translate(var(--dx), 105vh) rotate(var(--giro)); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .ov.open, .ov.open .sheet { animation: none; } .confeti { display: none; } }

/* Dentro de .fld las etiquetas son títulos en mayúsculas; las casillas y colores no */
.fld .chk, .fld .color-fila, .fld .tema { text-transform: none; letter-spacing: 0; margin-bottom: 0; font-size: 13.5px; color: var(--text); display: flex; }
.fld .chk { margin-bottom: 10px; font-weight: 600; }
.fld .tema { font-size: 11px; color: var(--muted); }
.fld .tema.sel { color: var(--text); }

.tabbar, .fab, .hdr-more { display: none; }
/* ── Lavado de cara v1.27 ── */
.ico { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex-shrink: 0; }
.hdr-logo { display: flex; align-items: center; gap: 7px; }
.hdr-logo .ico { color: color-mix(in srgb, var(--pink) 25%, #fff); }
.sync-status[hidden] { display: none !important; }
.ev-t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.ev-s { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-top: 2px; }
.ev-s .when { display: inline-block; font-size: 11px; padding: 1px 8px; margin-right: 6px; vertical-align: 1px; }
.wa.discreto { width: 30px; height: 30px; background: transparent; color: #25d366; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, #25d366 55%, transparent); }
.franja { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--muted); box-shadow: var(--shadow); }
.franja span { cursor: pointer; }
.franja b { color: var(--text); }
.franja-prox { color: var(--text); }
.hero { display: block !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
.cell.esc { background: color-mix(in srgb, var(--esc) 12%, transparent); }
.cell.today.esc { background: color-mix(in srgb, var(--esc) 12%, transparent); }
.dots { align-items: center; }
.dots b { font-size: 11px; line-height: 1; font-weight: 400; }
.dots small { font-size: 9px; font-weight: 800; color: var(--muted); }
[data-theme="dark"] .date-badge { color: color-mix(in srgb, var(--c) 55%, #fff); background: color-mix(in srgb, var(--c) 22%, transparent); }
[data-theme="dark"] .cell.holiday .dnum { color: color-mix(in srgb, var(--fest) 35%, #fff); }
.footer { padding-bottom: 24px; }
.hint a { color: var(--pink); font-weight: 700; }
.aj-quien { background: var(--card2); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; line-height: 1.5; margin-bottom: 14px; color: var(--muted); }
.aj-quien b { color: var(--text); }
.seg { display: flex; gap: 4px; background: var(--card2); border-radius: 12px; padding: 4px; }
.seg button { flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 9px; font-family: inherit; font-weight: 700; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.seg button.sel { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.aj-det { margin-bottom: 14px; }
.aj-det summary { cursor: pointer; list-style: none; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 10px 14px; background: var(--card2); border-radius: 12px; display: flex; justify-content: space-between; }
.aj-det summary::-webkit-details-marker { display: none; }
.aj-det summary::after { content: '›'; font-size: 16px; line-height: 1; transition: transform .2s; }
.aj-det[open] summary::after { transform: rotate(90deg); }
.aj-det[open] summary { margin-bottom: 10px; }
.btn.aj-ancho { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
.hdr-more .ico { width: 22px; height: 22px; }
.footer { text-align: center; padding: 30px 20px 10px; color: var(--hint); font-size: 11px; border-top: 1px solid var(--border); margin-top: 30px; }

/* ── MÓVIL ── */
@media (max-width: 1100px) { .year-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px) {
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { display: none; }
  .hdr { padding: calc(6px + env(safe-area-inset-top)) 16px 6px; min-height: 52px; }
  .hdr-logo { font-size: 15px; }
  .hdr-btn { display: none; }
  .hdr-more { display: flex; font-size: 18px; padding: 4px 10px; }
  .sync-status { font-size: 0; width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
  .content { padding: 14px 16px 96px; }
  /* Resumen en una fila que se desliza, para que el calendario quede a la vista */
  .hero { display: flex; overflow-x: auto; gap: 8px; margin: 0 -16px 14px; padding: 0 16px 4px; scroll-padding: 0 16px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .hero::-webkit-scrollbar { display: none; }
  .metric { flex: 0 0 78%; padding: 12px 14px; scroll-snap-align: start; }
  .metric-val { font-size: 15px; }
  .avisos { padding: 10px 14px; margin-bottom: 12px; }
  .fld input, .fld select, .fld textarea { font-size: 16px; }   /* evita el zoom automático del iPhone */
  .cal-nav { margin-bottom: 10px; }
  .nbtn { height: 40px; min-width: 40px; }
  .cal-title { font-size: 18px; min-width: 0; flex: 1; }
  .cell { min-height: 54px; padding: 5px 2px; }
  .dots i { width: 7px; height: 7px; }
  .dnum { margin: 0 auto 3px; font-size: 12.5px; }
  .pill, .more { display: none; }
  .dots { display: flex; }
  .cal-head div { padding: 8px 0; font-size: 10px; }
  .year-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .mini { padding: 10px 8px; }
  .mini-g span { font-size: 10px; padding: 2px 0; }
  .ov { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 20px 20px 0 0; max-height: 94vh; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: transparent; border: none; color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tab-ico { font-size: 22px; }
  .tab-ico { font-size: 22px; line-height: 1; display: flex; }
  .tab-item.active { color: var(--pink); }
  .tab-item.active .tab-ico { color: var(--pink); }
  .fab {
    display: flex; position: fixed; right: 18px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 210;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: linear-gradient(135deg,var(--pink),var(--pink2)); color: #fff; font-size: 30px; font-weight: 700;
    box-shadow: 0 8px 20px color-mix(in srgb, var(--pink) 40%, transparent); cursor: pointer; align-items: center; justify-content: center;
  }
  .toast { bottom: calc(90px + env(safe-area-inset-bottom)); }
  .tipo { font-size: 9.5px; }
}
/* ── Versión pública ── */
.hdr-logo em { font-style: normal; }
.tel-opc { display: flex; flex-direction: column; gap: 8px; }
.tel-opc button { text-align: left; }
.bienv-logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 4px auto 10px; box-shadow: var(--shadow); }
.bienv-txt { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.footer a { color: inherit; }
</style>
</head>

    </div>
  </header>

  <nav class="side">

const IDIOMAS = CalComun.IDIOMAS;
function idiomaTel() {
  for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''])) {
    const c = String(l).slice(0, 2).toLowerCase();
    if (IDIOMAS[c]) return c;
  }
  return 'en';
}
let L = IDIOMAS[CFG.idioma] ? CFG.idioma : idiomaTel();
const t = (k, ...a) => String((T[L] || T.en)[k] ?? T.en[k] ?? T.es[k] ?? k).replace(/\{(\d)\}/g, (_, i) => a[i]);
const LOCALES = { es: 'es-ES', en: 'en-US', pt: 'pt-BR', fr: 'fr-FR', ca: 'ca-ES', it: 'it-IT', de: 'de-DE' };
let MESES, MES_C, DIAS, DIAS_C;
// «— en 2 días» va en minúscula; en alemán no, porque los sustantivos llevan mayúscula («in 2 Tagen»)
const minus = s => L === 'de' ? s : s.toLowerCase();
function nombresFechas() {
  const loc = LOCALES[L] || 'en-US', limpio = s => s.replace(/^(d’|d'|de )/i, '').replace('.', '');
  MESES = [...Array(12)].map((_, m) => limpio(new Intl.DateTimeFormat(loc, { month: 'long' }).format(new Date(2026, m, 1))));
  MES_C = [...Array(12)].map((_, m) => limpio(new Intl.DateTimeFormat(loc, { month: 'short' }).format(new Date(2026, m, 1))).slice(0, 3));
  DIAS = [...Array(7)].map((_, d) => new Intl.DateTimeFormat(loc, { weekday: 'long' }).format(new Date(2026, 0, 4 + d)));   // 4/1/2026 es domingo
  DIAS_C = [...Array(7)].map((_, d) => new Intl.DateTimeFormat(loc, { weekday: 'short' }).format(new Date(2026, 0, 4 + d)).replace('.', ''));
}
function aplicarIdioma() {
  document.documentElement.lang = L;
  document.title = t('app');
  document.querySelectorAll('.sel-idioma').forEach(s => { s.innerHTML = Object.entries(IDIOMAS).map(([c, n]) => `<option value="${c}">${n}</option>`).join(''); s.value = L; });
  nombresFechas();
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.getElementById('f-tel').placeholder = t('telPh');
}
function setIdioma(v, enBienvenida) {
  L = v; CFG.idioma = v; persist(); aplicarIdioma();
  if (enBienvenida) pintarPaises('b-pais', document.getElementById('b-pais').value);
  else { pintarAjustesTodo(); }
  render();
}

// ══ PAÍS ══ Decide el prefijo de los teléfonos, los festivos, el Día de la Madre/Padre, el cambio de hora y las estaciones.
const PAISES = CalComun.PAISES;
function paisTel() {   // el de la región del teléfono (es-ES → ES), si está en la lista
  const m = ((navigator.languages && navigator.languages[0]) || navigator.language || '').match(/-([A-Z]{2})\b/i);
  return m && PAISES[m[1].toUpperCase()] ? m[1].toUpperCase() : '';
}
function nombrePais(c) {
  try { return new Intl.DisplayNames([L], { type: 'region' }).of(c); } catch (e) { return c; }
}
function pintarPaises(id, sel) {
  const lista = Object.keys(PAISES).map(c => [c, nombrePais(c)]).sort((a, b) => a[1].localeCompare(b[1], L));
  document.getElementById(id).innerHTML = lista.map(([c, n]) => `<option value="${c}"${c === sel ? ' selected' : ''}>${esc(n)}</option>`).join('') +
    `<option value="XX"${sel === 'XX' ? ' selected' : ''}>${esc(t('otroPais'))}</option>`;
}

// ══ OCURRENCIAS ══ Devuelve [{ev, fecha:Date, edad}] entre start y end (incluidos)
function occurrences(start, end, incluirOcultos) {
  const res = [];
  for (const ev of EVENTS) {
    if (!incluirOcultos && CFG.ocultos.includes(ev.tipo)) continue;
    const base = parse(ev.fecha);
    const push = d => {
      if (d < base || d < start || d > end) return;
      const o = { ev, fecha: d };
      if (ev.anioConocido && ev.repite === 'anual') o.edad = d.getFullYear() - base.getFullYear();
      res.push(o);
    };
    if (ev.repite === 'anual') {
      for (let y = start.getFullYear(); y <= end.getFullYear(); y++)
        push(new Date(y, base.getMonth(), Math.min(base.getDate(), daysIn(y, base.getMonth()))));
    } else if (ev.repite === 'mensual') {
      for (let y = start.getFullYear(), m = start.getMonth(); y < end.getFullYear() || (y === end.getFullYear() && m <= end.getMonth()); m++) {
        if (m > 11) { m = 0; y++; }
        push(new Date(y, m, Math.min(base.getDate(), daysIn(y, m))));
      }
    } else if (ev.repite === 'semanal') {
      let d = new Date(base);
      if (d < start) d = addD(d, Math.ceil(diffDays(d, start) / 7) * 7);
      for (; d <= end; d = addD(d, 7)) push(new Date(d));
    } else push(base);
  }
  res.sort((a, b) => a.fecha - b.fecha || (a.ev.hora || '').localeCompare(b.ev.hora || ''));
  return res;
}
function festivosEntre(start, end) {
  const verFest = !CFG.ocultos.includes('festivo'), verCeleb = !CFG.ocultos.includes('celebraciones'), verEst = !CFG.ocultos.includes('estaciones');
  const out = [];
  for (let y = start.getFullYear(); y <= end.getFullYear(); y++) {
    const c = capasDelAnio(y);
    [...(verFest ? c.fest : []), ...(verCeleb ? c.celeb : []), ...(verEst ? c.est : [])]
      .forEach(f => { const d = parse(f.fecha); if (d >= start && d <= end) out.push({ ...f, d }); });
  }
  return out;
}

// ══ TEXTOS ══
function cuando(d) {
  const n = diffDays(TODAY, d);
  if (n === 0) return [t('hoyX'), 'hoy'];
  if (n === 1) return [t('manana'), 'pronto'];
  if (n < 0) return [t('haceD', -n), ''];
  if (n <= 7) return [t('enD', n), 'pronto'];
  if (n < 60) return [t('enD', n), ''];
  return [t('enM', Math.round(n / 30.4)), ''];
}
const fechaLarga = d => new Intl.DateTimeFormat(LOCALES[L] || 'en-US', { weekday: 'long', day: 'numeric', month: 'long' }).format(d);
const fechaCorta = d => L === 'en' ? MES_C[d.getMonth()] + ' ' + d.getDate() : d.getDate() + ' ' + MES_C[d.getMonth()];
function subtitulo(o) {
  const ev = o.ev, bits = [];
  const anios = o.edad + ' ' + (o.edad === 1 ? t('anio') : t('anios'));
  if (o.edad != null) bits.push(ev.tipo === 'cumple' ? t('cumpleA', o.edad) : ev.tipo === 'recuerdo' ? (/cumpleaños|birthday/i.test(ev.titulo) ? t('cumpliria', o.edad) : t('partida', anios)) : /boda|casad|wedding|married/i.test(ev.titulo) ? t('juntos', anios) : t('seCumplen', anios));
  if (ev.hora) bits.push(ev.hora + (L === 'de' ? ' Uhr' : L === 'en' ? '' : ' h'));
  if (ev.persona) bits.push(ev.persona);
  if (ev.notas) bits.push(ev.notas);
  return bits.join(' · ');
}

function waNumero(tel) {
  const s = String(tel || '').replace(/[^\d+]/g, '');   // fuera espacios, guiones y marcas invisibles de Contactos
  let d = s.replace(/\D/g, '');

  if (!pre || d.length < 6) return '';

  return d.startsWith(pre) && d.length >= 10 ? d : pre + d;

  }).join('')}${avEst.map(f => `<div class="aviso" onclick="openDay('${f.fecha}')">${f.icon} <b>${esc(txt(f.titulo))}</b> — ${minus(cuando(f.d)[0])}</div>`).join('')}</div>` : '';

  // Resumen (si hay algo en «No te olvides», no se repite aquí)
  const prox = occurrences(TODAY, addD(TODAY, 366), true);
  const hoy = prox.filter(o => diffDays(TODAY, o.fecha) === 0);
  const proxEv = prox.find(o => diffDays(TODAY, o.fecha) > 0);
  document.getElementById('hero').innerHTML = hoy.length || av.length ? '' :
    `<div class="franja"><span class="franja-hoy" onclick="openDay('${iso(TODAY)}')">${t('hoyNada', fechaCorta(TODAY))}</span>` +
    (proxEv ? `<span class="franja-prox" onclick="openForm('${proxEv.ev.id}')">${t('proximo')} ${(TIPOS[proxEv.ev.tipo] || TIPOS.otro).icon} <b>${esc(proxEv.ev.titulo)}</b> ${minus(cuando(proxEv.fecha)[0])}</span>` : '') + `</div>`;

  // Cuadrícula
  const lun = lunesPrimero();
  document.getElementById('cal-head').innerHTML = [...Array(7)].map((_, i) => `<div>${DIAS_C[(i + (lun ? 1 : 0)) % 7]}</div>`).join('');
  document.getElementById('cal-title').textContent = MESES[viewM] + ' ' + viewY;
  const first = new Date(viewY, viewM, 1);
  const start = addD(first, -((first.getDay() + (lun ? 6 : 0)) % 7));
  const end = addD(start, 41);
  const occ = occurrences(start, end);
  const fest = festivosEntre(start, end);
  const byDay = {}, festDay = {};
  occ.forEach(o => (byDay[iso(o.fecha)] ||= []).push(o));
  fest.forEach(f => (festDay[f.fecha] ||= []).push(f));
  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = addD(start, i), k = iso(d), evs = byDay[k] || [], fs = festDay[k] || [];
    if (i === 35 && d.getMonth() !== viewM) break; // no pintar 6ª fila vacía
    const cls = ['cell', d.getMonth() !== viewM && 'other', +d === +TODAY && 'today', (d.getDay() % 6 === 0) && 'weekend', fs.some(esFestivo) && 'holiday'].filter(Boolean).join(' ');
    const items = [...evs.map(o => { const tp = TIPOS[o.ev.tipo] || TIPOS.otro; return `<span class="pill" style="--c:${tp.color}">${tp.icon} ${esc(o.ev.titulo)}</span>`; }),
                   ...fs.map(f => `<span class="pill" style="--c:${festColor(f)}">${festIcon(f)} ${esc(festTitulo(f))}</span>`)];
    // En el móvil: mini iconos (🎂, 💍, 🌸…); los festivos ya van en rojo
    const marcas = [...evs.map(o => (TIPOS[o.ev.tipo] || TIPOS.otro).icon), ...fs.filter(f => !esFestivo(f)).map(festIcon)];
    const dots = marcas.slice(0, 2).map(m => `<b>${m}</b>`).join('') + (marcas.length > 2 ? `<small>+${marcas.length - 2}</small>` : '');
    html += `<div class="${cls}" onclick="openDay('${k}')"><div class="dnum">${d.getDate()}</div>${items.slice(0, 3).join('')}${items.length > 3 ? `<div class="more">${t('masN', items.length - 3)}</div>` : ''}<div class="dots">${dots}</div></div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;

  // Lista del mes
  const mStart = new Date(viewY, viewM, 1), mEnd = new Date(viewY, viewM, daysIn(viewY, viewM));
  const rows = [...occurrences(mStart, mEnd).map(o => ({ d: o.fecha, h: evRow(o) })), ...festivosEntre(mStart, mEnd).map(f => ({ d: f.d, h: festRow(f) }))].sort((a, b) => a.d - b.d);
  document.getElementById('mes-list-title').textContent = t('enMes', MESES[viewM]);
  document.getElementById('mes-list').innerHTML = rows.length ? rows.map(r => r.h).join('')
    : `<div class="empty">${t('mesVacio', MESES[viewM])}<br><button class="btn primary small" onclick="openForm()">${t('anadirEv')}</button></div>`;
}

function go(p) {

  document.querySelectorAll('[data-page]').forEach(x => x.classList.toggle('active', x.dataset.page === p));

function moveMonth(n) { viewM += n; if (viewM < 0) { viewM = 11; viewY--; } if (viewM > 11) { viewM = 0; viewY++; } renderMes(); }
function goToday() { viewY = TODAY.getFullYear(); viewM = TODAY.getMonth(); renderMes(); }
// Deslizar en el calendario para cambiar de mes
(() => { let x0 = null; const g = () => document.getElementById('cal-grid');
  document.addEventListener('touchstart', e => { x0 = g().contains(e.target) ? e.touches[0].clientX : null; }, { passive: true });
  document.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) moveMonth(dx < 0 ? 1 : -1); x0 = null; });
})();
// Botón «atrás» de Android: cierra la hoja de arriba (o vuelve a «Mes») en vez de salir de la app.
// Mientras haya algo que cerrar, el historial guarda una entrada de más («guarda») que se gasta al pulsar atrás.
let guarda = false;

function abrirHoja(id) { document.getElementById(id).classList.add('open'); ponerGuarda(); }
window.addEventListener('popstate', () => {
  guarda = false;

  if (abiertas.length) {
    abiertas[abiertas.length - 1].classList.remove('open');

const TEMAS = {
  lavanda: { nombre: { es: 'Lavanda', en: 'Lavender', pt: 'Lavanda', fr: 'Lavande', ca: 'Lavanda', it: 'Lavanda', de: 'Lavendel' }, tint: '#7b5fae', hdr1: '#5d4b80', hdr2: '#7c67a3', acento: '#f72585', acento2: '#b5179e' },

  vino:    { nombre: { es: 'Vino', en: 'Wine', pt: 'Vinho', fr: 'Bordeaux', ca: 'Vi', it: 'Vino', de: 'Wein' },                      tint: '#9a5563', hdr1: '#5e2533', hdr2: '#8a3a4c', acento: '#d6336c', acento2: '#a51d4f' },
  durazno: { nombre: { es: 'Durazno', en: 'Peach', pt: 'Pêssego', fr: 'Pêche', ca: 'Préssec', it: 'Pesca', de: 'Pfirsich' },         tint: '#c8876a', hdr1: '#8c4a33', hdr2: '#c06a48', acento: '#ef6b3f', acento2: '#c64b28' },
  menta:   { nombre: { es: 'Menta', en: 'Mint', pt: 'Menta', fr: 'Menthe', ca: 'Menta', it: 'Menta', de: 'Minze' },                  tint: '#4c9a84', hdr1: '#28604f', hdr2: '#3f8a73', acento: '#12a57a', acento2: '#0c7a5a' },
  oceano:  { nombre: { es: 'Océano', en: 'Ocean', pt: 'Oceano', fr: 'Océan', ca: 'Oceà', it: 'Oceano', de: 'Ozean' },                tint: '#4a82b0', hdr1: '#274f78', hdr2: '#3f7bab', acento: '#1d8be0', acento2: '#1463ad' },
  grafito: { nombre: { es: 'Grafito', en: 'Graphite', pt: 'Grafite', fr: 'Graphite', ca: 'Grafit', it: 'Grafite', de: 'Graphit' },  tint: '#6e7585', hdr1: '#343945', hdr2: '#555c6c', acento: '#7064ff', acento2: '#4c43d1' },
};
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mezcla = (a, b, p) => '#' + hex2rgb(a).map((v, i) => Math.round(v * (1 - p) + hex2rgb(b)[i] * p).toString(16).padStart(2, '0')).join('');  // p = cuánto de b
const luz = h => { const [r, g, b] = hex2rgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// «Tu color»: a partir de un solo color; cabecera y acento más oscuros para que el texto blanco se lea
function temaDesde(c) {
  const os = '#1a1726', claro = luz(c) > .6;
  return { tint: c, hdr1: mezcla(c, os, .5), hdr2: mezcla(c, os, claro ? .4 : .2), acento: mezcla(c, '#000000', claro ? .35 : .08), acento2: mezcla(c, os, .4) };
}
function applyEstilo() {
  const tm = CFG.tema === 'propio' && CFG.propio ? temaDesde(CFG.propio) : TEMAS[CFG.tema] || TEMAS.lavanda;
  const st = document.documentElement.style;
  [['--tint', tm.tint], ['--hdr1', tm.hdr1], ['--hdr2', tm.hdr2], ['--pink', tm.acento], ['--pink2', tm.acento2]].forEach(([k, v]) => st.setProperty(k, v));
  // Barra de estado del móvil del mismo color que la cabecera
  document.querySelector('meta[name=theme-color]').content = document.documentElement.dataset.theme === 'dark' ? mezcla(tm.hdr1, '#1b1b26', .4) : tm.hdr1;
}

// ══ CONFETI ══ una vez al día, si hoy alguien cumple años o es un aniversario
function festejar() {
  if (store.get('micalendario_confeti') === iso(TODAY)) return;
  if (!occurrences(TODAY, TODAY, true).some(o => ['cumple', 'aniversario'].includes(o.ev.tipo))) return;
  store.set('micalendario_confeti', iso(TODAY));
  const cols = [getComputedStyle(document.documentElement).getPropertyValue('--pink').trim(), '#ffaa00', '#00d68f', '#00b4d8', '#7b61ff', '#ff3d71'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i');
    c.className = 'confeti';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % cols.length]};--dx:${Math.round((Math.random() - .5) * 160)}px;` +
      `--giro:${Math.round(Math.random() * 720 - 360)}deg;animation-duration:${(2 + Math.random() * 1.8).toFixed(2)}s;animation-delay:${(Math.random() * .6).toFixed(2)}s`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

function exportJSON() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'micalendario', version: APP_VERSION, events: EVENTS, cfg: CFG }, null, 2)], { type: 'application/json' }));
  a.download = (L === 'es' ? 'mi-calendario-copia-' : 'my-calendar-backup-') + iso(new Date()) + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importJSON(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.events)) throw 0;
      if (confirm(t('reemplazar', EVENTS.length, d.events.length))) {
        EVENTS = d.events.filter(e => e && e.id && e.fecha && e.titulo);
        if (d.cfg) CFG = Object.assign(CFG, d.cfg, { idioma: CFG.idioma, pais: CFG.pais });
        persist(); applyTheme(); render(); pintarAjustesTodo();
        toast(t('restaurada'));
      }
    } catch (e) { toast(t('copiaMala')); }
    input.value = '';
  };
  r.readAsText(f);
}

// ══ VERSIÓN NUEVA ══ Compara esta versión con la publicada; si hay una más nueva, ofrece recargar
async function checkVersion() {
  if (location.protocol !== 'https:') return;
  try {
    const html = await (await fetch('./?v=' + Date.now(), { cache: 'no-store' })).text();
    const pub = (html.match(/const APP_VERSION = '([^']+)'/) || [])[1];
    document.getElementById('upd-banner').hidden = !pub || pub === APP_VERSION;
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });

document.getElementById('f-wa-ico').outerHTML = WA_SVG;
aplicarIdioma();
applyTheme();
render();
festejar();
if (!CFG.pais) abrirBienvenida();
checkVersion();
document.getElementById('app-version').textContent = 'v' + APP_VERSION;
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e));
</script>
